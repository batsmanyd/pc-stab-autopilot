name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FluentCleaner/FluentCleaner.csproj -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build FluentCleaner/FluentCleaner.csproj --configuration Release --no-restore -p:Platform=${{ matrix.platform }}

      - name: Validate embedded PowerShell diagnostics syntax
        shell: pwsh
        run: |
          $source = Get-Content 'FluentCleaner/Services/AutopilotRunner.cs' -Raw
          $match = [regex]::Match($source, '(?s)const string script = """\r?\n(.*?)\r?\n\s*""";')
          if (-not $match.Success) { throw 'Embedded diagnostics script not found' }
          $script = [regex]::Replace($match.Groups[1].Value, '(?m)^ {12}', '')
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Publish portable Windows application
        run: dotnet publish FluentCleaner/FluentCleaner.csproj --configuration Release --no-restore -p:Platform=${{ matrix.platform }} -p:PublishDir=${{ github.workspace }}/publish/${{ matrix.platform }}/

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: pc-stab-autopilot-${{ matrix.platform }}-${{ github.sha }}
          path: publish/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
